name: Smoke Test BrowserBox Action
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run BrowserBox
        id: bbx
        uses: ./
        with:
          license-key: ${{ secrets.BBX_LICENSE_KEY }}
          timeout: 3 # Short timeout for smoke test

      - name: Verify Login Link Output
        run: |
          echo "Login Link: ${{ steps.bbx.outputs.login-link }}"
          if [[ -z "${{ steps.bbx.outputs.login-link }}" ]]; then
            echo "Error: Login link is empty"
            exit 1
          fi
