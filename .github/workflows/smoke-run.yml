name: Live Smoke Run
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      timeout:
        description: "Minutes to keep the session alive"
        required: false
        default: "10"

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run BrowserBox
        id: bbx
        uses: ./
        with:
          license-key: ${{ secrets.BBX_LICENSE_KEY }}
          timeout: ${{ github.event.inputs.timeout || '10' }}
