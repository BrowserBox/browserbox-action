name: Live Smoke Run
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Tracking Issue
        id: tracking
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_URL=$(gh issue create --title "Live Smoke Test Run" --body "Tracking live link for $(date)" --repo ${{ github.repository }})
          ISSUE_NUMBER=$(echo "$ISSUE_URL" | grep -oE '[0-9]+$')
          echo "issue-number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Tracking on issue #$ISSUE_NUMBER"

      - name: Run BrowserBox
        id: bbx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BROADCAST_ISSUE_NUMBER: ${{ steps.tracking.outputs.issue-number }}
        uses: ./
        with:
          license-key: ${{ secrets.BBX_LICENSE_KEY }}
          timeout: 10 # 10 minutes for your confirmation
