name: Live Smoke Run
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run BrowserBox
        id: bbx
        uses: ./
        with:
          license-key: ${{ secrets.BBX_LICENSE_KEY }}
          timeout: 10 # 10 minutes for your confirmation
